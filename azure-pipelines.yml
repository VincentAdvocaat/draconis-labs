trigger:
  branches:
    include:
      - main
pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: Install Node.js

  - bash: |
      set -euo pipefail
      store_path="$(corepack pnpm store path)"
      mkdir -p "$store_path"
      printf '##vso[task.setvariable variable=pnpmStorePath]%s\n' "$store_path"
    displayName: Locate pnpm store

  - task: Cache@2
    displayName: Cache pnpm store
    inputs:
      key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
      path: $(pnpmStorePath)

  - pwsh: ./scripts/verify-local-integration.ps1
    displayName: Verify frozen install, build, lint, typecheck, tests and startup
